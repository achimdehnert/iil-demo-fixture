[project]
name = "iil-demo-fixture"
version = "0.1.0"
description = "Demo-Org-Fixture für iil-Plattform — idempotente Stammdaten für Staging-Umgebungen"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Achim Dehnert", email = "achim.dehnert@iil.gmbh"}
]
keywords = ["django", "fixture", "staging", "demo", "iil"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "Django>=5.0,<6.0",
    "iil-platform-context>=0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iil_demo_fixture"]
sources = {"src" = ""}

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
